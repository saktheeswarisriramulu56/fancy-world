<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Fancy World</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-body">
    <div class="background-wrapper">
        <img src="/static/images/bg_luxury.png" alt="Jewellery Background">
    </div>

    <div class="login-container">
        <div class="auth-icon"><i class="fas fa-key"></i></div>
        <div class="brand-title">Fancy World</div>
        <div class="subtitle">Reset Password via SMS</div>

        {% if error %}
        <div style="background: rgba(233, 30, 99, 0.2); color: #ff8fb6; padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem;">
            {{ error }}
        </div>
        {% endif %}

        <form id="forgotPasswordForm">
            <!-- Step 1: Identify User -->
            <div id="step1">
                <div class="input-group">
                    <label for="identifier">Email Address or Username</label>
                    <input type="text" id="identifier" placeholder="Enter email or username" required>
                </div>
                <button type="button" class="login-btn" onclick="sendResetOtp()" id="sendOtpBtn">Send Reset OTP</button>
            </div>

            <!-- Step 2: Verify OTP -->
            <div id="step2" style="display: none;">
                <p style="color: #aaa; font-size: 0.9em; margin-bottom: 15px;">OTP sent to your registered mobile number <span id="maskedPhone"></span>.</p>
                <div class="input-group">
                    <label for="otpCode">6-Digit OTP</label>
                    <input type="text" id="otpCode" placeholder="••••••" maxlength="6" style="text-align: center; letter-spacing: 5px;">
                </div>
                <div id="timer" style="margin-bottom: 15px; font-size: 0.75rem; color: #ccc;"></div>
                <button type="button" class="login-btn" onclick="verifyResetOtp()" id="verifyOtpBtn">Verify OTP</button>
            </div>

            <!-- Step 3: New Password -->
            <div id="step3" style="display: none;">
                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" minlength="6">
                </div>
                <button type="button" class="login-btn" onclick="resetPassword()" id="resetBtn">Change Password</button>
            </div>

            <small id="statusMsg" style="display: block; margin-top: 15px; font-size: 0.85rem; text-align: center; color: #ff8fb6;"></small>

            <div class="signup-link">
                Remember your password? <a href="/login">Sign In</a>
            </div>
        </form>
    </div>

    <script>
        let countdownTimer;

        async function sendResetOtp() {
            const identifier = document.getElementById('identifier').value;
            const statusMsg = document.getElementById('statusMsg');
            const btn = document.getElementById('sendOtpBtn');

            if (!identifier) {
                statusMsg.textContent = 'Please enter username or email';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            
            try {
                const response = await fetch('/api/forgot-password/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    statusMsg.textContent = '';
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    document.getElementById('maskedPhone').textContent = result.masked_phone;
                    startTimer(300); // 5 minutes
                } else {
                    statusMsg.textContent = result.message || 'Error sending request';
                    statusMsg.style.color = '#ff8fb6';
                    btn.disabled = false;
                    btn.innerHTML = 'Send Reset OTP';
                }
            } catch (error) {
                statusMsg.textContent = 'Server error. Try again.';
                btn.disabled = false;
                btn.innerHTML = 'Send Reset OTP';
            }
        }

        async function verifyResetOtp() {
            const otpCode = document.getElementById('otpCode').value;
            const statusMsg = document.getElementById('statusMsg');
            const btn = document.getElementById('verifyOtpBtn');

            if (!otpCode) {
                statusMsg.textContent = 'Please enter the OTP';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

            try {
                const response = await fetch('/api/forgot-password/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otp: otpCode })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    statusMsg.textContent = 'OTP Verified! Enter new password.';
                    statusMsg.style.color = '#4caf50';
                    clearInterval(countdownTimer);
                    document.getElementById('step2').style.display = 'none';
                    document.getElementById('step3').style.display = 'block';
                } else {
                    statusMsg.textContent = result.message || 'Invalid OTP';
                    statusMsg.style.color = '#ff8fb6';
                    btn.disabled = false;
                    btn.innerHTML = 'Verify OTP';
                }
            } catch (error) {
                statusMsg.textContent = 'Verification failed.';
                btn.disabled = false;
                btn.innerHTML = 'Verify OTP';
            }
        }

        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const statusMsg = document.getElementById('statusMsg');
            const btn = document.getElementById('resetBtn');

            if (!newPassword || newPassword.length < 6) {
                statusMsg.textContent = 'Password must be at least 6 characters.';
                statusMsg.style.color = '#ff8fb6';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

            try {
                const response = await fetch('/api/forgot-password/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_password: newPassword })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    statusMsg.textContent = 'Password reset successfully! Redirecting to login...';
                    statusMsg.style.color = '#4caf50';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    statusMsg.textContent = result.message || 'Error resetting password';
                    statusMsg.style.color = '#ff8fb6';
                    btn.disabled = false;
                    btn.innerHTML = 'Change Password';
                }
            } catch (error) {
                statusMsg.textContent = 'Failed to reset password.';
                btn.disabled = false;
                btn.innerHTML = 'Change Password';
            }
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const timerDisplay = document.getElementById('timer');
            
            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                timerDisplay.textContent = "OTP expires in: " + minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(countdownTimer);
                    timerDisplay.textContent = "OTP Expired. Please refresh to start again.";
                    document.getElementById('verifyOtpBtn').disabled = true;
                }
            }, 1000);
        }
    </script>
</body>
</html>
