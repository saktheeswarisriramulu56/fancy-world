<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | Fancy World</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta http-equiv="refresh" content="3;url=/login">
</head>

<body class="auth-body">
    <div class="background-wrapper">
        <img src="/static/images/bg_luxury.png" alt="Jewellery Background">
    </div>

    <div class="logout-container">
        <div class="success-check">
            <i class="fas fa-check"></i>
        </div>
        <div class="brand-title">Fancy World</div>
        <h2 style="color: white; margin-bottom: 0.5rem;">Signed Out Successfully</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Thank you for visiting. See you soon!</p>

        <div style="font-size: 0.8rem; color: var(--primary-gold);">
            Redirecting to login in 3 seconds...
        </div>

        <a href="/login" class="cta-btn"
            style="display: inline-block; margin-top: 1.5rem; padding: 10px 20px; font-size: 0.9rem;">Back to Login</a>
    </div>
</body>

</html>
