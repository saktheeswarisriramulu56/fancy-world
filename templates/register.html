<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Fancy World</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-body">
    <div class="background-wrapper">
        <img src="/static/images/bg_luxury.png" alt="Jewellery Background">
    </div>

    <div class="login-container">
        <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
        <div class="brand-title">Fancy World</div>
        <div class="subtitle">Create Your Account</div>

        {% if error %}
        <div style="background: rgba(233, 30, 99, 0.2); color: #ff8fb6; padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem;">
            {{ error }}
        </div>
        {% endif %}

        <form id="registerForm" action="/register" method="POST">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="userPhone" name="phone" placeholder="+91 1234567890" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" id="createAccountBtn" class="login-btn">CREATE ACCOUNT</button>

            <div class="signup-link">
                Already have an account? <a href="/login">Sign In</a>
            </div>
        </form>
    </div>

    <script>
        // Form simplification - no OTP verification needed
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            // Standard form submission
        });
    </script>
</body>

</html>
