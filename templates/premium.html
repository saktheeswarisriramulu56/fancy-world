<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Collection | Fancy World</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .premium-hero {
            height: 40vh;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), url('/static/images/bg_luxury.png');
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            margin-top: 3.5rem;
        }

        .premium-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary-gold);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .crown-icon {
            font-size: 2rem;
            color: var(--primary-gold);
            margin-bottom: 1rem;
        }

        .luxury-card {
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: 0.4s;
        }

        .luxury-card:hover {
            border-color: var(--primary-gold);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }
    </style>
</head>

<body class="mobile-app-body">
    <header class="app-header">
        <div class="app-header__content">
            <a href="/home" class="app-header__icon"><i class="fas fa-arrow-left"></i></a>
            <div class="app-header__logo"><span class="logo-text">Premium</span></div>
            <a href="/cart" class="app-header__icon">
                <i class="fas fa-shopping-bag"></i>
                {% if cart_count > 0 %}<span class="cart-badge">{{ cart_count }}</span>{% endif %}
            </a>
        </div>
    </header>

    <div class="premium-hero">
        <div class="crown-icon"><i class="fas fa-crown"></i></div>
        <h1 class="premium-title">The Royal Collection</h1>
        <p style="color: rgba(255,255,255,0.7); letter-spacing: 1px;">Elegance Redefined</p>
    </div>

    <div style="padding: 1.5rem;">
        <div class="products-grid">
            {% for p in products %}
            <div class="product-card-mobile luxury-card" onclick="window.location.href='/customize/{{ p._id }}'"
                style="cursor: pointer;">
                <div class="product-card-mobile__image-wrapper">
                    <img src="{{ p.image_url or '/static/images/default.png' }}" alt="{{ p.name }}"
                        class="product-card-mobile__image">
                    <div
                        style="position: absolute; top: 10px; left: 10px; background: var(--primary-gold); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 0.6rem; font-weight: bold;">
                        PREMIUM</div>
                </div>
                <div class="product-card-mobile__info">
                    <h3 class="product-card-mobile__name" style="color: var(--primary-gold);">{{ p.name }}</h3>
                    <p class="product-card-mobile__category">{{ p.category }}</p>
                    <div class="product-card-mobile__footer">
                        <span class="product-card-mobile__price">₹{{ "%.2f"|format(p.price) }}</span>
                        <button class="product-card-mobile__add-btn"
                            style="background: var(--primary-gold); color: #000;">Customize</button>
                    </div>
                </div>
            </div>
            {% endfor %}
            {% if not products %}
            <div style="text-align: center; grid-column: 1/-1; padding: 4rem; color: #888;">
                <p>Curating premium items for you...</p>
            </div>
            {% endif %}
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>

</html>
