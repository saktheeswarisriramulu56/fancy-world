<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bindis Collection | Fancy World</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bindi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.5rem;
            padding: 2rem 5%;
        }

        .bindi-item {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }

        .bindi-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
        }

        .bindi-img-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--primary-gold);
        }

        .bindi-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bindi-label {
            color: var(--primary-gold-light);
            font-weight: 500;
            margin-bottom: 8px;
            height: 40px;
        }

        .price-tag {
            display: block;
            color: #fff;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .add-btn {
            width: 100%;
            padding: 8px;
            background: var(--primary-gold);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">Fancy World</div>
        <ul class="nav-links">
            <li><a href="/home">Home</a></li>
            <li><a href="/about.html">About</a></li>
        </ul>
        <div class="icon-links">
            <a href="/cart" class="icon-btn">
                <i class="fas fa-shopping-bag"></i>
                {% if cart_count > 0 %}<span class="cart-badge">{{ cart_count }}</span>{% endif %}
            </a>
        </div>
    </nav>

    <header class="hero"
        style="height: 25vh; background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('/static/images/bindi_collection.png');">
        <div class="hero-content">
            <h1>Fancy Bindi</h1>
        </div>
    </header>

    <div class="bindi-grid">
        {% for p in products %}
        <div class="bindi-item" onclick="window.location.href='/customize/{{ p._id }}'" style="cursor: pointer;">
            <div class="bindi-img-wrapper">
                <img src="{{ p.image_url or '/static/images/default.png' }}" alt="{{ p.name }}">
            </div>
            <div class="bindi-label">{{ p.name }}</div>
            <div class="price-tag">₹{{ "%.2f"|format(p.price) }}</div>
            <button class="add-btn" style="background: var(--primary-gold); color: black;">Customize</button>
        </div>
        {% endfor %}
        {% if not products %}
        <div style="text-align: center; grid-column: 1/-1; padding: 3rem; color: #888;">
            <p>No design found. Check back later!</p>
        </div>
        {% endif %}
    </div>
    <script src="/static/js/main.js"></script>
</body>

</html>
