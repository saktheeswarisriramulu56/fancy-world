<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Fancy World Jewelry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.8);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding-top: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .search-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .search-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 1rem;
        }

        /* Search Controls */
        .search-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 2rem;
            align-items: center;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
            margin-bottom: 3rem;
        }

        .text-search-box {
            position: relative;
        }

        .text-search-box input {
            width: 100%;
            padding: 1rem 3rem 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .text-search-box input:focus {
            outline: none;
            border-color: var(--primary-gold);
            background: rgba(255, 255, 255, 0.1);
        }

        .text-search-box i {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-gold);
        }

        .divider {
            height: 50px;
            width: 1px;
            background: rgba(212, 175, 55, 0.3);
        }

        /* CNN Image Search Box */
        .cnn-search-box {
            text-align: center;
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(45deg, #d4af37, #b8962e);
            color: black;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .upload-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        #image-preview {
            max-width: 100px;
            max-height: 100px;
            border-radius: 10px;
            margin-top: 1rem;
            display: none;
            border: 2px solid var(--primary-gold);
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-gold);
        }

        .product-img {
            height: 300px;
            width: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 1.5rem;
            text-align: center;
        }

        .product-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .product-price {
            color: var(--primary-gold);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .confidence-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--primary-gold);
            color: black;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 10;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(212, 175, 55, 0.1);
            border-top-color: var(--primary-gold);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .search-controls {
                grid-template-columns: 1fr;
            }

            .divider {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar (Same as home) -->
    <nav class="navbar"
        style="position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(5,5,5,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; box-sizing: border-box;">
        <div class="logo"
            style="font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--primary-gold); font-weight: 900;">
            Fancy World</div>
        <ul class="nav-links" style="display: flex; gap: 2rem; list-style: none;">
            <li><a href="/home" style="text-decoration: none; color: white;">Home</a></li>
            <li><a href="/category/all" style="text-decoration: none; color: white;">Collections</a></li>
            <li><a href="/about" style="text-decoration: none; color: white;">About</a></li>
        </ul>
        <div class="icon-links" style="display: flex; gap: 1.5rem;">
            <a href="/cart" style="color: white; font-size: 1.2rem; position: relative;">
                <i class="fas fa-shopping-bag"></i>
                {% if cart_count > 0 %}
                <span
                    style="position: absolute; top: -8px; right: -8px; background: var(--primary-gold); color: black; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; font-weight: bold;">{{
                    cart_count }}</span>
                {% endif %}
            </a>
            <a href="/profile" style="color: white; font-size: 1.2rem;"><i class="fas fa-user-circle"></i></a>
        </div>
    </nav>

    <div class="container">
        <div class="search-header">
            <h1>Find Your Sparkle</h1>
            <p style="color: var(--text-muted);">Search our collection by keyword or upload a photo to find similar
                items using AI.</p>
        </div>

        <div class="search-controls">
            <!-- Text Search -->
            <div class="text-search-box">
                <input type="text" id="keyword-input" placeholder="Search by name, category or material..."
                    onkeyup="handleTextSearch(this.value)">
                <i class="fas fa-search"></i>
            </div>

            <div class="divider"></div>

            <!-- CNN Image Search -->
            <div class="cnn-search-box">
                <label for="image-upload" class="upload-btn">
                    <i class="fas fa-camera"></i>
                    <span>Search by Image</span>
                </label>
                <input type="file" id="image-upload" accept="image/*" style="display: none;"
                    onchange="handleImageSearch(event)">
                <img id="image-preview" src="" alt="Preview">
                <p id="cnn-info" style="font-size: 0.8rem; color: var(--primary-gold); margin-top: 0.5rem;"></p>
            </div>
        </div>

        <div id="results-count" style="margin-bottom: 1.5rem; color: var(--text-muted);"></div>

        <div class="results-grid" id="results-container">
            <!-- Results will be injected here -->
            <div style="grid-column: 1/-1; text-align: center; padding: 5rem; color: var(--text-muted);">
                <i class="fas fa-gem" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.3;"></i>
                <p>Start searching to see our exquisite pieces.</p>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 1rem; color: var(--primary-gold); font-weight: 500;">AI is analyzing your image...</p>
    </div>

    <script>
        let searchTimeout;

        function handleTextSearch(query) {
            clearTimeout(searchTimeout);
            if (query.length < 2) return;

            searchTimeout = setTimeout(() => {
                fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                })
                    .then(res => res.json())
                    .then(data => displayResults(data, 'Keyword Search'));
            }, 500);
        }

        async function handleImageSearch(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 1. Improved Javascript Image Preview (Requirement 1 & 4)
            const preview = document.getElementById('image-preview');
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'inline-block';
            }
            reader.readAsDataURL(file);

            // 2. Prepare for API (Requirement: multipart/form-data)
            const formData = new FormData();
            formData.append('image', file);

            document.getElementById('loader').style.display = 'flex';
            document.getElementById('cnn-info').innerText = "Analyzing sparkle patterns...";

            try {
                // Requirement: Use fetch /api/image-search
                const response = await fetch('/api/image-search', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                // Requirement: Debugging log
                console.log("AI Search Data:", data);

                if (data.status === 'error' || data.error) {
                    const errorMsg = data.message || data.error || 'AI processing failed';
                    document.getElementById('cnn-info').innerHTML = `<span style="color: #ff8fb6;">${errorMsg}</span>`;
                    displayResults([], 'Visual Search Error');
                } else {
                    // Requirement: Safely handle undefined/NaN
                    const category = data.detected_category || "Unknown";
                    
                    // Requirement: Ensure confidence is numeric and defaults to 0
                    let rawConfidence = parseFloat(data.confidence);
                    if (isNaN(rawConfidence)) rawConfidence = 0;
                    const confidenceStr = rawConfidence.toFixed(1);
                    
                    // Requirement: Specific display format
                    document.getElementById('cnn-info').innerText = `Detected: ${category} (${confidenceStr}% match)`;
                    
                    displayResults(data.products || [], `Visual Match: ${category}`);
                }
            } catch (err) {
                console.error("Critical Failure:", err);
                document.getElementById('cnn-info').innerHTML = `<span style="color: #ff8fb6;">AI connection interrupted.</span>`;
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function displayResults(products, mode) {
            const container = document.getElementById('results-container');
            const countLabel = document.getElementById('results-count');

            if (!products || products.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 5rem; color: var(--text-muted);">
                    <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.2;"></i>
                    <p>No matches found in our collection. Try another photo of necklaces, earrings or bangles.</p>
                </div>`;
                countLabel.innerText = `Search: ${mode}`;
                return;
            }

            countLabel.innerText = `Found ${products.length} pieces for ${mode}`;

            container.innerHTML = products.map((p, index) => {
                const isBest = index === 0 && p.confidence >= 90;
                const labelColor = isBest ? 'var(--primary-gold)' : 'rgba(255,255,255,0.1)';
                const labelText = isBest ? 'Best Match' : 'Similar Style';

                return `
                <div class="product-card" onclick="window.location.href='/customize/${p.id || p._id}'" 
                     style="animation: fadeIn 0.5s ease forwards; animation-delay: ${index * 0.1}s; opacity: 0;">
                    
                    <div class="confidence-badge" style="background: ${isBest ? '#d4af37' : '#333'}; color: ${isBest ? 'black' : 'white'};">
                        ${isBest ? `<i class="fas fa-star"></i> ` : ''} 
                        ${(p.confidence || 0).toFixed(1)}% 
                    </div>
                    
                    <img src="${p.image_url}" alt="${p.name}" class="product-img">
                    
                    <div class="product-info">
                        <div style="font-size: 0.75rem; color: var(--primary-gold); letter-spacing: 2px; margin-bottom: 8px;">
                            ${labelText.toUpperCase()}
                        </div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">₹${parseFloat(p.price).toLocaleString()}</div>
                        
                        <div style="margin-top: 15px;">
                            <span style="font-size: 0.8rem; color: #888;">${p.category}</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        /* Helper for animations */
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
</body>

</html>
